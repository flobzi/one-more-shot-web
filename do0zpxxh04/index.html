		<script>/* AUDIO-JS:BEGIN  Unlock Web Audio on the first tap, including the loading

	const Ctor = window.AudioContext || window.webkitAudioContext;
	const ctxs = [];

	let hidden = false;
	let autoplayBlocked = null;   // null = not probed yet
	let prompt = null;

	// The same 5x7 face as game/src/view/pixel_font.gd (TAP TO START only).
	const GLYPHS = {
		T: "11111001000010000100001000010000100",
		A: "01110100011000111111100011000110001",
		P: "11110100011000111110100001000010000",
		O: "01110100011000110001100011000101110",
		S: "01111100001000001110000010000111110",
		R: "11110100011000111110101001001010001",
		" ": "00000000000000000000000000000000000",
	};

	if (Ctor) {
		class Patched extends Ctor {
			constructor(opts) {
				super(opts);
				ctxs.push(this);
				if (unlocked) unlockCtx(this);
				this.addEventListener('statechange', syncPrompt);
			}
		}
		window.AudioContext = Patched;
		if (window.webkitAudioContext) window.webkitAudioContext = Patched;
	}

	function live() {
		return ctxs.filter((c) => c && c.state !== 'closed');
	}

	function anyRunning() {
		return live().some((c) => c.state === 'running');
	}

	function unlockCtx(ctx) {
		if (!ctx || ctx.state === 'closed') return;
		const resume = ctx.resume && ctx.resume();
		if (resume && resume.catch) resume.catch(function () {});
		try {
			const buf = ctx.createBuffer(1, 1, ctx.sampleRate || 44100);
			const src = ctx.createBufferSource();
			src.buffer = buf;
			src.connect(ctx.destination);
			src.start(0);
		} catch (e) {}
	}

	function onGesture() {
		unlocked = true;
		live().forEach(unlockCtx);
		syncPrompt();
	}
	['pointerdown', 'touchstart', 'keydown'].forEach((ev) => {
		window.addEventListener(ev, onGesture, { capture: true, passive: true });
	});

		const ae = document.activeElement;
		if (!ae || ae === document.body || ae === document.documentElement) return false;
		if (ae.tagName === 'IFRAME') return true;
		return !!(ae.closest && (ae.closest('#ad-banner') || ae.closest('#ad-interstitial')));

		hidden = on;

		if (!prompt) return;
		prompt.classList.toggle('oms-tap-center', !document.getElementById('status'));
	}

	function drawPrompt() {
		if (!prompt) return;
		const canvas = prompt.querySelector('canvas');
		const text = 'TAP TO START';
		const W = 5, H = 7, ADV = 6, S = 4;
		const w = text.length * ADV - 1;

		canvas.height = H * S;

				for (let col = 0; col < W; col++) {

		// and never show it if the browser already allows sound. After a tap, hide it

		// later context is still suspended, show it again.

			prompt.removeAttribute('hidden');

		if (prompt || !document.body) return;
		prompt = document.createElement('div');
		prompt.id = 'oms-tap';
		prompt.setAttribute('hidden', '');
		prompt.setAttribute('role', 'button');

		document.body.appendChild(prompt);

		if (!Ctor) { autoplayBlocked = false; syncPrompt(); return; }
		let ctx;
		try { ctx = new (window.AudioContext || Ctor)(); } catch (e) {
			autoplayBlocked = true;
			syncPrompt();
			return;
		}
		const finish = function () {
			autoplayBlocked = ctx.state !== 'running';
			if (!autoplayBlocked) unlocked = true;
			try { ctx.close(); } catch (e) {}
			const i = ctxs.indexOf(ctx);
			if (i >= 0) ctxs.splice(i, 1);
			syncPrompt();
		};

		if (p && p.then) p.then(finish).catch(finish);
		else finish();
		setTimeout(function () { if (autoplayBlocked === null) finish(); }, 300);
	}

	function boot() {
		makePrompt();
		probe();
	}
	if (document.body) boot();
	else document.addEventListener('DOMContentLoaded', boot);

	return {
		ready: function () { return unlocked || anyRunning(); },
		get hidden() { return hidden; },
		// tests
		_ctxs: ctxs,
		_setHidden: setHidden,
		_sync: syncPrompt,

			return (ctx.suspend ? ctx.suspend() : Promise.resolve()).catch(function () {})
				.then(function () { syncPrompt(); return ctx.state; });
		},
	};
})();

   insets. Whatever happens to ads.js, the game fills the screen. */

	function $(id) { return document.getElementById(id); }

	// The canvas fills the screen above the banner strip (canvas resize policy "None"
	// in the export: this page sizes it). The court is never under the banner.
	function fitCanvas() {
		const c = $('canvas');
		if (!c) return;
		const dpr = window.devicePixelRatio || 1;
		const strip = $('ad-banner') ? $('ad-banner').getBoundingClientRect().height : 0;
		const w = window.innerWidth;
		const h = Math.max(1, window.innerHeight - strip);
		c.style.position = 'absolute';
		c.style.left = '0px';
		c.style.top = '0px';
		c.style.width = w + 'px';
		c.style.height = h + 'px';
		const pw = Math.round(w * dpr);
		const ph = Math.round(h * dpr);
		if (c.width !== pw || c.height !== ph) {
			c.width = pw;
			c.height = ph;
		}

		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			setStatusMode('hidden');
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
