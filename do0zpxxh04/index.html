	padding: 0;

	--oms-scrim: rgba(26, 16, 48, 0.94);

body {
	position: fixed;
	inset: 0;
	overflow: hidden;
	overscroll-behavior: none;        /* no pull-to-refresh, no bounce */
	touch-action: none;               /* no browser pan / pinch-zoom / double-tap zoom */
	-webkit-user-select: none;
	user-select: none;                /* no long-press text selection */
	-webkit-touch-callout: none;      /* no iOS long-press menu */
	-webkit-tap-highlight-color: transparent;
	-webkit-text-size-adjust: 100%;
}

body {
	color: var(--oms-ink);
	background-color: var(--oms-paper);
}

/* Bottom ad strip: always reserved (the game lays itself out above it), filled only
   on menus / lobby / results. */
#ad-banner {
	position: fixed;
	/* With provider 'none' the strip is only the home-bar safe area. */
	left: 0;
	right: 0;
	bottom: 0;
	height: calc(var(--oms-ad-h, 0px) + env(safe-area-inset-bottom, 0px));
	padding-bottom: env(safe-area-inset-bottom, 0px);
	box-sizing: border-box;
	background: var(--oms-strip);
	display: flex;
	align-items: center;
	justify-content: center;
	z-index: 2;
	touch-action: manipulation;
}
#ad-banner .oms-ad-slot { visibility: hidden; }
#ad-banner.on .oms-ad-slot { visibility: visible; }
.oms-test-ad {
	width: 320px;
	max-width: 92vw;
	height: 50px;
	border: 1px dashed var(--oms-muted);
	color: var(--oms-muted);
	font: 600 11px/50px monospace;
	text-align: center;
	letter-spacing: 1px;
}
#ad-interstitial {
	position: fixed;
	inset: 0;
	z-index: 5;
	display: none;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: 18px;
	background: var(--oms-scrim);
	color: var(--oms-scrim-ink);
	font: 600 13px monospace;
	letter-spacing: 1px;
	text-align: center;
	touch-action: manipulation;
}
#ad-interstitial.on { display: flex; }
#ad-interstitial .oms-test-box {
	width: min(80vw, 320px);
	height: min(60vh, 480px);
	border: 1px dashed var(--oms-scrim-ink);
	display: flex;
	align-items: center;
	justify-content: center;
	flex-direction: column;
	gap: 8px;
}
#ad-interstitial button {
	font: 600 14px monospace;
	letter-spacing: 1px;
	padding: 12px 28px;
	min-height: 44px;
	border: 1px solid var(--oms-scrim-ink);
	background: transparent;
	color: var(--oms-scrim-ink);
}
#ad-interstitial button:disabled { opacity: 0.5; }
#oms-safe-probe {
	position: fixed;
	visibility: hidden;
	pointer-events: none;
	padding: env(safe-area-inset-top, 0px) env(safe-area-inset-right, 0px) env(safe-area-inset-bottom, 0px) env(safe-area-inset-left, 0px);
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: var(--oms-paper);
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

/* Loading page: the logo (boot splash) centred on cream, a thin ink bar under it. */
#status-splash.fullsize--false {
	width: min(43vw, 216px);
	height: auto;
	image-rendering: pixelated;
	image-rendering: crisp-edges;
}
#status-progress {
	bottom: auto;
	top: calc(50% + min(14.4vw, 72px) + 12px);   /* just under the logo */
	width: min(26vw, 120px);
	height: 4px;
	margin: 0 auto;
	-webkit-appearance: none;
	appearance: none;
	border: 0;
	background: var(--oms-track);
	color: var(--oms-ink);
}
#status-progress::-webkit-progress-bar { background: var(--oms-track); }
#status-progress::-webkit-progress-value { background: var(--oms-ink); }
#status-progress::-moz-progress-bar { background: var(--oms-ink); }

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}
